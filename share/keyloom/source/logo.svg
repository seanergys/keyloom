       x="906"
       y="260"
       width="88"
       height="1080"
       rx="44" />
    <rect
       id="thread-4"
       x="1156"
       y="260"
       width="88"
       height="1080"
       rx="44" />
    <!-- key, drawn once and used for both its gap and its body -->
    <g
       id="key-shape">
