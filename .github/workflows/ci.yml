name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every job reads the repository only; deploy-pages asks for more itself.
permissions:
  contents: read

# A new push to a pull request or branch cancels its running pipeline.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commits; the comment above each names its release.
jobs:
  # ----------------------------------------------------------------------------
  # Legal
  # ----------------------------------------------------------------------------

  reuse:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v10.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run reuse lint

  # ----------------------------------------------------------------------------
  # Check
  # ----------------------------------------------------------------------------

  ruff:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v10.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check

  # ----------------------------------------------------------------------------
  # Test
  # ----------------------------------------------------------------------------

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v10.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q --ignore=tests/test_fuzz.py

  fuzz-test:
    runs-on: ubuntu-latest
    env:
      KEYLOOM_FUZZ_CASES: "100"
      # The run id makes every run explore new cases and is printed below, so
      # a failure can be replayed by setting KEYLOOM_FUZZ_SEED to it.
      KEYLOOM_FUZZ_SEED: ${{ github.run_id }}
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v10.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: echo "fuzz seed=$KEYLOOM_FUZZ_SEED cases=$KEYLOOM_FUZZ_CASES"
      - run: uv run pytest -q tests/test_fuzz.py

  # ----------------------------------------------------------------------------
  # Security
  # ----------------------------------------------------------------------------

  # pip-audit checks the locked runtime dependencies against the PyPI advisory
  # database.
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v10.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: >-
          uv export --frozen --no-default-groups --no-emit-project
          --format requirements-txt --output-file requirements.txt
      - run: >-
          uv run pip-audit --strict --disable-pip --require-hashes
          -r requirements.txt

  # ----------------------------------------------------------------------------
  # Build
  # ----------------------------------------------------------------------------

  build-package:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # v10.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv build
      # v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/

  # cpdocs builds the API of every version in docs/cpdocs.yml from Git, so the
  # job needs the full history and the branches. It documents the version
  # named "main" from this checkout instead of origin/main: a pull request
  # then checks the API documentation of the code under review, and only a
  # push to main publishes it.
  build-docs:
    runs-on: ubuntu-latest
    env:
      CPDOCS_CURRENT_BRANCH: main
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # v10.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run properdocs build --strict
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/site

  # ----------------------------------------------------------------------------
  # Deploy
  # ----------------------------------------------------------------------------

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      # Publish to GitHub Pages, with an OIDC token proving which run deploys.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # v5.0.1
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
