<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 1600 1600" width="1600" height="1600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>keyloom icon</title>
  <defs>
    <!-- the top half of the tile, where thread-1 crosses over the bow -->
    <clipPath id="clip-upper-half">
      <rect width="1600" height="800"/>
    </clipPath>
    <!-- warp threads, left to right -->
    <rect id="thread-1" x="406" y="260" width="88" height="1080" rx="44"/>
    <rect id="thread-2" x="656" y="260" width="88" height="1080" rx="44"/>
    <rect id="thread-3" x="906" y="260" width="88" height="1080" rx="44"/>
    <rect id="thread-4" x="1156" y="260" width="88" height="1080" rx="44"/>
    <!-- key, drawn once and used for both its gap and its body -->
    <g id="key-shape">
      <path id="key-bow" fill-rule="evenodd" d="M235,800 a215,215 0 1 0 430,0 a215,215 0 1 0 -430,0 Z M345,800 a105,105 0 1 0 210,0 a105,105 0 1 0 -210,0 Z"/>
      <rect id="key-shaft" x="620" y="740" width="740" height="120" rx="24"/>
      <rect id="key-tooth-1" x="1030" y="780" width="80" height="220" rx="24"/>
      <rect id="key-tooth-2" x="1280" y="780" width="80" height="290" rx="24"/>
    </g>
    <!-- thread sections lying on top of the key -->
    <g id="threads-over-shape">
      <use xlink:href="#thread-3"/>
      <use xlink:href="#thread-1" clip-path="url(#clip-upper-half)"/>
    </g>
  </defs>
  <g id="background" inkscape:groupmode="layer" inkscape:label="background">
    <rect id="tile" width="1600" height="1600" rx="360" fill="#266C7C"/>
  </g>
  <g id="threads-under" inkscape:groupmode="layer" inkscape:label="threads-under">
    <use id="thread-1-under" xlink:href="#thread-1" fill="#EBA333"/>
    <use id="thread-2-under" xlink:href="#thread-2" fill="#EBA333"/>
    <use id="thread-4-under" xlink:href="#thread-4" fill="#EBA333"/>
  </g>
  <g id="key" inkscape:groupmode="layer" inkscape:label="key">
    <use id="key-gap" xlink:href="#key-shape" fill="#266C7C" stroke="#266C7C" stroke-width="60" stroke-linejoin="round"/>
    <use id="key-body" xlink:href="#key-shape" fill="#FFFFFF"/>
  </g>
  <g id="threads-over" inkscape:groupmode="layer" inkscape:label="threads-over">
    <use id="threads-over-gap" xlink:href="#threads-over-shape" fill="#266C7C" stroke="#266C7C" stroke-width="60" stroke-linejoin="round"/>
    <use id="threads-over-body" xlink:href="#threads-over-shape" fill="#EBA333"/>
  </g>
</svg>
