         x="1280"
         y="780"
         width="80"
         height="290"
         rx="24" />
    </g>
    <!-- thread sections lying on top of the key -->
    <g
       id="threads-over-shape">
      <use
         xlink:href="#thread-3"
         id="use1" />
      <use
         xlink:href="#thread-1"
         clip-path="url(#clip-upper-half)"
         id="use2" />
    </g>
  </defs>
